# Deploys the workbench to Google Cloud (Cloud Run behind IAP) on every push to main of
# ps-salesforce/agentic-marketing-gcp (ADR-018). No key is stored: GitHub's OIDC token is exchanged
# through the workload identity pool `github-actions` for a short-lived token of the deploy-only
# service account, and Google accepts the token only from this repository's main branch.
# This workflow lives only in this repository; upstream (awbauer/agentic-marketing-demo) deploys to Cloudflare.
name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push waits rather than racing the one in flight.
concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ps-salesforce/agentic-marketing-gcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-cloud
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Build and deploy (scripts/gcp/deploy.sh)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_REGION: us-central1
        run: scripts/gcp/deploy.sh

      - name: Read back the serving revision
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          gcloud --project "$GCP_PROJECT" run services describe northstar-workbench \
            --region us-central1 \
            --format='value(status.latestReadyRevisionName,status.conditions[0].status)' |
            tee -a "$GITHUB_STEP_SUMMARY"
